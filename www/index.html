const hav=(a,b)=>{const R=6371008.8,r=Math.PI/180,p=(b[0]-a[0])*r,q=(b[1]-a[1])*r,x=Math.sin(p/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(q/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const areaM=P=>{if(P.length<3)return 0;const R=6371008.8,r=Math.PI/180;let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=(b[1]-a[1])*r*(2+Math.sin(a[0]*r)+Math.sin(b[0]*r))}return Math.abs(s*R*R/2)};
function measUpd(){if(!ML)ML=L.layerGroup().addTo(MAP);ML.clearLayers();MP.forEach(p=>L.circleMarker(p,{radius:5,color:'#ff9800',fillOpacity:1}).addTo(ML));if(S.meas==='a'&&MP.length>2)L.polygon(MP,{color:'#ff9800',weight:3,fillOpacity:.15}).addTo(ML);else if(MP.length>1)L.polyline(MP,{color:'#ff9800',weight:3}).addTo(ML);
 let x;if(S.meas==='d'){let d=0;for(let i=1;i<MP.length;i++)d+=hav(MP[i-1],MP[i]);x=t('mLen')+': '+(d>=1000?(d/1000).toFixed(3)+' km':d.toFixed(1)+' m')}else{const a=areaM(MP);x=t('mArea')+': '+(a>=1e6?(a/1e6).toFixed(4)+' km²':a>=1e4?(a/1e4).toFixed(3)+' ha':a.toFixed(1)+' m²')}$('mrt').textContent=x}
function measEnd(){S.meas=null;MP=[];if(ML)ML.clearLayers();$('mres').hidden=1;$('mbd').classList.remove('on');$('mba').classList.remove('on')}
function measure(k){if(!MAP)return;if(S.meas===k){measEnd();return}S.meas=k;MP=[];$('mres').hidden=0;$('mbd').classList.toggle('on',k==='d');$('mba').classList.toggle('on',k==='a');measUpd()}

 const run=()=>{const q=$('sq').value.trim();if(!q||!MAP)return;const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){let a=+m[1],b=+m[2];if(Math.abs(a)>90)[a,b]=[b,a];dlgClose();MAP.setView([a,b],Math.max(MAP.getZoom(),17));if(!SK)SK=L.layerGroup().addTo(MAP);SK.clearLayers();L.circleMarker([a,b],{radius:9,color:'#ff9800'}).addTo(SK);return}
  const res=[],ql=q.toLowerCase(),fv=at=>Object.values(at||{}).find(x=>String(x).toLowerCase().includes(ql));
  DB.areas.forEach(a=>a.L.forEach(l=>{const g=l.g;(g.la||[]).forEach((at,k)=>{const v=fv(at);if(v&&res.length<30){const p=g.l[k],mi=Math.floor((p.length/2-1)/2)*2;res.push([l.n+' · '+v,[(p[mi+1]+p[mi+3])/2,(p[mi]+p[mi+2])/2]])}});(g.pa||[]).forEach((at,k)=>{const v=fv(at);if(v&&res.length<30)res.push([l.n+' · '+v,[g.p[k][1],g.p[k][0]]])})}));
  $('sres').innerHTML=res.length?res.map((x,k)=>`<button class=li2 data-r=${k}>${esc(x[0])}</button>`).join(''):`<p class=nt>${t('noResults')}</p>`;$('sres').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const x=res[+b.dataset.r];dlgClose();MAP.setView(x[1],19)})};
 $('sgo').onclick=run;$('sq').onkeydown=e=>{if(e.key==='Enter')run()};$('sc0').onclick=dlgClose}

$('fl').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const ext=f.name.split('.').pop().toLowerCase();let gj,crs;
 try{if(ext==='zip'){const buf=await f.arrayBuffer();if(!/\.prj/i.test(new TextDecoder('latin1').decode(new Uint8Array(buf))))throw new Error(t('errPrj'));gj=await shp(buf);crs=t('crsPrj')}
  else if(ext==='kml'){gj=toGeoJSON.kml(new DOMParser().parseFromString(await f.text(),'text/xml'));crs=t('crsKml')}

  else throw new Error(t('errFmt',{e:ext}))}
 catch(x){dlgShow(`<h3>${t('cantImport')}</h3><p>${esc(x.message)}</p><div class=act><button class=pr id=oc>${t('ok')}</button></div>`);$('oc').onclick=dlgClose;return}
 S.imp={f,gj,crs};pnl('import')};

Object.assign(I.fa,{about:'درباره‌ی برنامه',dev:'توسعه‌دهنده',ver:'نسخه',abIntro:'ARG یک برنامه‌ی اندروید است که لایه‌های تأسیسات زیرزمینی (آب، گاز، برق، مخابرات، فاضلاب) را از فایل‌های GIS شما روی نقشه و در واقعیت افزوده (AR) با استفاده از دوربین، GPS و قطب‌نمای گوشی نشان می‌دهد.',abPriv:'پروژه‌های شما فقط داخل خود برنامه روی همین گوشی ذخیره می‌شوند. هیچ داده‌ای به سرور ارسال نمی‌شود؛ فقط کاشی‌های نقشه از اینترنت دریافت می‌شوند. با حذف برنامه یا پاک کردن داده‌هایش پروژه‌ها از بین می‌روند؛ پیش از آن پشتیبان بگیرید.',abCred:'ساخته‌شده با Capacitor، Leaflet، shpjs و togeojson. داده‌ی نقشه: © مشارکت‌کنندگان OpenStreetMap، تصاویر ماهواره‌ای Esri و OpenTopoMap.'});
const HELP={en:[
['Quick start',`<ol><li>Open ARG. In the start dialog tap <b>CREATE NEW PROJECT</b> and type a name.</li><li>Tap the <b>layers icon</b> in the top bar, then the <b>+</b> button next to “Map Layers” → <b>New area</b>.</li><li>Tap <b>+</b> again → <b>Import layer from file</b> and choose a GeoJSON, KML or Shapefile (.zip with .prj) file from the Android file picker. A file received in a messenger (Telegram, Eitaa, WhatsApp…) must first be saved to the phone storage, e.g. the Downloads folder.</li><li>Set name, type, color and depth, then <b>Import</b>. The layer appears on the map.</li><li>Tap the <b>AR</b> button in the top bar, then <b>Start AR with GPS</b>, and point the camera at the ground.</li></ol>`],
['Screen overview',`<ul><li><b>Top bar</b>: app icon and name with the current project below it. Tap the <b>app icon</b> (top-left) to open the main menu as a side panel from the left; the <b>Layers</b> icon opens the Layers panel; the <b>AR / MAP</b> button switches between camera view and map view.</li><li><b>Status strip</b> (map view): GPS pin (green = position found, red = error), accuracy in meters, compass heading, visible/total layers.</li><li><b>Left buttons</b>: <b>◎</b> my location, <b>🔍</b> search; bottom-left: <b>ruler</b> measure distance, <b>triangle</b> measure area.</li><li><b>Bottom-right</b>: <b>+</b> zoom in, <b>−</b> zoom out, <b>↻</b> redraw map, <b>⤢</b> zoom to the whole project.</li></ul>`],
['Main menu (top-left icon)',`<ul><li>Tap the app icon to open the menu from the left. Each item opens as a side panel on the <b>right</b>:</li><li><b>Projects</b>, <b>Project Settings</b>, <b>Layers</b>, <b>Import layer</b>, <b>Backup &amp; Restore</b>, <b>Settings</b> (language, theme), <b>Help</b>, <b>About</b>.</li><li><b>Close Project</b> returns to the start dialog.</li></ul>`],
['Projects',`<ul><li>Start dialog: <b>CONTINUE WITH “name”</b> opens the last project; <b>OPEN PROJECT</b> lets you pick one; <b>CREATE NEW PROJECT</b> makes a new one. With no projects only the create option (and Restore backup) is shown.</li><li><b>Projects panel</b> (menu → Projects): tap a project to open it, <b>+</b> creates one, the bin deletes it (with all its areas and layers). The open project is highlighted.</li><li><b>Project Settings</b>: rename (pencil) and see numbers of areas, layers, line/point features and attribute values.</li></ul>`],
['Layers panel',`<ul><li>Opens from the right. <b>⛶</b> makes it full width, <b>✕</b> closes it.</li><li><b>Background Map</b>: None, Streets (OpenStreetMap), Satellite (Esri), Hybrid (satellite + place names), Topo (OpenTopoMap).</li><li><b>Labels</b> shows or hides all labels (map and AR). <b>My location</b> shows or hides the blue dot.</li><li><b>Filter</b>: [All Layers], [Line Layers], [Point Layers].</li><li><b>Map Layers + button</b>: Import layer from file, or New area.</li><li>An <b>area row</b> has a checkbox (show/hide the whole area) a pencil (rename/delete) and a <b>down arrow</b> that collapses or expands the layers of that area. Layers are listed under their area; the first layer in the list is drawn on top.</li><li>Tap a <b>layer row</b> to select it. The icons are: zoom to layer · attribute table · <b>settings (Layer Symbol)</b> · move up · move down · delete. The checkbox shows or hides the layer.</li></ul>`],
['Importing layers',`<ul><li>Supported: <b>GeoJSON</b> (WGS 84), <b>KML</b> (WGS 84), <b>Shapefile</b> as .zip containing the .prj file (any coordinate system, converted automatically).</li><li>Not supported: DXF, GPKG, TIFF and other formats that do not carry their own coordinate system. A Shapefile ZIP without .prj, or a GeoJSON declaring another CRS, is rejected with a message.</li><li>Import panel (opens on the right): <b>Name</b>; <b>Area</b>; <b>Type</b> (Water, Gas, Electric, Telecom, Sewer, Other — sets default color and depth); <b>Color</b>; <b>Line width</b>; <b>Depth</b> (m below ground, AR). The last line tells how the coordinate system was understood.</li><li>A field called label or name is chosen automatically for labels.</li></ul>`],
['Converting other formats (QGIS)',`<ol><li>Open the file in QGIS and set the correct CRS (e.g. EPSG:32640 for UTM 40 N).</li><li>Right-click the layer → Export → Save Features As…</li><li>Choose <b>GeoJSON</b> with CRS EPSG:4326, or <b>ESRI Shapefile</b> (zip it with its .prj).</li><li>Import the result into ARG.</li></ol>`],
['Layer Symbol',`<ul><li>Open it with the gear icon of a selected layer. <b>💾</b> saves, <b>✕</b> closes without saving.</li><li><b>Layer Name</b> and <b>Depth (m)</b> (used in AR when “Show at real depth” is on).</li><li><b>Style Type → Single</b>: one symbol for the layer. <b>Categorized</b>: one symbol per value of the chosen <b>Field</b>; features with other values use the layer symbol.</li><li><b>Label Field</b>: attribute written next to features (map: zoom ≥ 17; AR: always in range). None = no labels.</li><li><b>Layer Symbol</b>: tap it to set color, line width and point marker (ring or none).</li><li>Category tools: <b>+</b> add a value manually, <b>↻</b> regenerate all values from the data, <b>≡</b> sort; pencil changes a category color, <b>✕</b> removes it.</li></ul>`],
['Map tools',`<ul><li><b>◎</b> centers on your position (asks permission the first time). <b>🔍</b>: type “lat, lon” to jump to coordinates, or text to search attribute values of visible layers.</li><li><b>Ruler</b>: tap points on the map to measure distance; <b>Triangle</b>: tap at least 3 points to measure area. Use Undo, Clear or ✕ in the result bar; tap the tool again to leave it.</li><li>Tap a line or point to see its attributes in a pop-up. Blue dot = you.</li></ul>`],
['AR view',`<ul><li>Tap <b>AR</b>. First time choose <b>Start AR with GPS</b> or <b>Simulate at project (no GPS)</b> (you stand at the project center and walk with the arrow buttons — good for testing indoors). Allow <b>Camera</b> and <b>Location</b> (choose Precise) when Android asks; the motion sensors need no permission.</li><li><b>Info bar</b>: heading, GPS accuracy or Simulated, items, nearest line distance. <b>Round mini map</b>: you from above (white triangle), layers as colored lines; a red arrow shows the direction of the project when it is far. <b>Orange bar</b>: warnings.</li><li>Lines use layer or category colors; rings mark points with distance in meters; labels follow “Label Field”.</li></ul>`],
['AR buttons and settings',`<ul><li><b>▲ ▼ ◀ ▶</b>: move your position forward/back/left/right by <i>Move step</i> relative to the camera direction (fix GPS error or walk in Simulate mode).</li><li><b>Snap to nearest point</b>: puts you exactly on the nearest visible point or line vertex — stand next to a known manhole first. <b>Reset position</b> removes manual shifts. <b>Restart camera</b> retries the camera.</li><li><b>⚙ AR settings</b>: <i>Depth offset</i> (only with “Show at real depth”), <i>Eye height</i>, <i>Camera field of view</i>, <i>Tilt trim</i> (shifts everything up/down; default +3°), <i>Align horizon</i> (aim the camera at the real horizon and tap — sets the tilt trim automatically), <i>Move step</i>, and <i>Show at real depth</i> (off = lines on the ground surface, on = underground at layer depth).</li></ul>`],
['Settings, backup and restore',`<ul><li>Menu → <b>Settings</b>: Language (English / فارسی) and Theme (System / Light / Dark); saved in the app.</li><li>Menu → <b>Backup &amp; Restore</b>: <b>Backup now</b> opens the Android share sheet with a JSON file of all projects — save it to Files/Drive or send it to yourself in a messenger; <b>Restore from file</b> picks such a file with the file picker (replaces current data).</li><li>Back up before uninstalling the app or clearing its data; both delete all projects.</li></ul>`],
['Getting good accuracy',`<ul><li>Phone GPS is accurate to a few meters, worse near buildings or trees. Wait for a small ± value in the status strip. Turn on Android Location and allow <b>Precise</b> location for ARG; stay outdoors.</li><li>Calibrate the compass with a figure-8 motion; stay away from metal and cars.</li><li>Stand beside a known point and use <b>Snap to nearest point</b>. For centimeters you need an external RTK GNSS receiver.</li></ul>`],
['Troubleshooting',`<ul><li><b>Black screen / “Camera could not start”</b>: open Android Settings → Apps → ARG → Permissions, allow <b>Camera</b>, then return to ARG and tap Restart camera. Close other apps that use the camera.</li><li><b>Nothing in AR</b>: check the item count, the project-distance warning, that layers are checked, or try Simulate.</li><li><b>Layer in the wrong place</b>: the file’s coordinate system was wrong — fix it in QGIS and re-import.</li><li><b>Lines too high/low</b>: keep “Show at real depth” off, use Snap to nearest point, then use Align horizon and adjust Field of view (wider = lines look smaller and move toward the horizon; narrower = they spread out and move down).</li><li><b>Blank map</b>: no internet or the tile server is blocked — try another background map.</li><li><b>GPS stays red / no position</b>: turn on Location in Android, set ARG location permission to <b>Precise</b>, and move outdoors.</li><li><b>Updating the app</b>: install the new APK over the old one; projects are kept. If Android refuses (different signing key), make a backup, uninstall, install the new APK and restore.</li></ul>`],
['Privacy and offline use',`<ul><li>All data stays inside the app on your phone. Use Backup to keep a copy.</li><li>The app itself works fully offline. Only background maps need internet; map tiles you have already viewed are kept on the phone and shown again offline.</li></ul>`]],
fa:[
['شروع سریع',`<ol><li>ARG را باز کنید. در پنجره‌ی شروع <b>ساخت پروژه‌ی جدید</b> را بزنید و نامی بنویسید.</li><li>آیکون <b>لایه‌ها</b> در نوار بالا را بزنید، سپس دکمه‌ی <b>+</b> کنار «لایه‌های نقشه» ← <b>محدوده‌ی جدید</b>.</li><li>دوباره <b>+</b> ← <b>وارد کردن لایه از فایل</b> و یک فایل GeoJSON، KML یا شیپ‌فایل (ZIP همراه prj.) را از انتخابگر فایل اندروید برگزینید. فایلی که از پیام‌رسان (تلگرام، ایتا، واتس‌اپ…) گرفته‌اید باید اول در حافظه‌ی گوشی، مثلاً پوشه‌ی Downloads، ذخیره شود.</li><li>نام، نوع، رنگ و عمق را تعیین کنید و <b>وارد کردن</b> را بزنید. لایه روی نقشه دیده می‌شود.</li><li>دکمه‌ی <b>AR</b> در نوار بالا، سپس <b>شروع AR با GPS</b> را بزنید و دوربین را به سمت زمین بگیرید.</li></ol>`],
['نمای کلی صفحه',`<ul><li><b>نوار بالا</b>: آیکون و نام برنامه با نام پروژه‌ی جاری زیرش. با لمس <b>آیکون برنامه</b> (بالا-چپ) منوی اصلی به‌صورت پنل کناری از سمت چپ باز می‌شود؛ آیکون <b>لایه‌ها</b> پنل لایه‌ها را باز می‌کند؛ دکمه‌ی <b>AR / نقشه</b> بین نمای دوربین و نقشه جابه‌جا می‌شود.</li><li><b>نوار وضعیت</b> (نمای نقشه): پین GPS (سبز = موقعیت پیدا شد، قرمز = خطا)، دقت به متر، جهت قطب‌نما، لایه‌های نمایان/کل.</li><li><b>دکمه‌های چپ</b>: <b>◎</b> موقعیت من، <b>🔍</b> جست‌وجو؛ پایین-چپ: <b>خط‌کش</b> اندازه‌گیری فاصله، <b>مثلث</b> اندازه‌گیری مساحت.</li><li><b>پایین-راست</b>: <b>+</b> بزرگ‌نمایی، <b>−</b> کوچک‌نمایی، <b>↻</b> بازترسیم نقشه، <b>⤢</b> زوم به کل پروژه.</li></ul>`],
['منوی اصلی (آیکون بالا-چپ)',`<ul><li>با لمس آیکون برنامه منو از سمت چپ باز می‌شود. هر گزینه به‌صورت پنل کناری در سمت <b>راست</b> نمایش داده می‌شود:</li><li><b>پروژه‌ها</b>، <b>تنظیمات پروژه</b>، <b>لایه‌ها</b>، <b>وارد کردن لایه</b>، <b>پشتیبان‌گیری و بازیابی</b>، <b>تنظیمات</b> (زبان، پوسته)، <b>راهنما</b>، <b>درباره‌ی برنامه</b>.</li><li><b>بستن پروژه</b> به پنجره‌ی شروع برمی‌گردد.</li></ul>`],
['پروژه‌ها',`<ul><li>پنجره‌ی شروع: <b>ادامه با «نام»</b> آخرین پروژه را باز می‌کند؛ <b>باز کردن پروژه</b> امکان انتخاب می‌دهد؛ <b>ساخت پروژه‌ی جدید</b> پروژه‌ی تازه می‌سازد. وقتی پروژه‌ای نیست فقط گزینه‌ی ساخت (و بازیابی پشتیبان) دیده می‌شود.</li><li><b>پنل پروژه‌ها</b> (منو ← پروژه‌ها): روی پروژه بزنید تا باز شود، <b>+</b> پروژه می‌سازد، سطل زباله آن را با همه‌ی محدوده‌ها و لایه‌هایش حذف می‌کند. پروژه‌ی باز رنگی است.</li><li><b>تنظیمات پروژه</b>: تغییر نام (مداد) و تعداد محدوده‌ها، لایه‌ها، عارضه‌های خطی/نقطه‌ای و مقدارهای ویژگی.</li></ul>`],
['پنل لایه‌ها',`<ul><li>از سمت راست باز می‌شود. <b>⛶</b> آن را تمام‌عرض می‌کند، <b>✕</b> می‌بندد.</li><li><b>نقشه‌ی پس‌زمینه</b>: بدون، خیابان (OpenStreetMap)، ماهواره (Esri)، ترکیبی (ماهواره + نام مکان‌ها)، توپوگرافی (OpenTopoMap).</li><li><b>برچسب‌ها</b> همه‌ی برچسب‌ها را (نقشه و AR) نشان یا پنهان می‌کند. <b>موقعیت من</b> نقطه‌ی آبی را نشان یا پنهان می‌کند.</li><li><b>فیلتر</b>: [همه‌ی لایه‌ها]، [لایه‌های خطی]، [لایه‌های نقطه‌ای].</li><li><b>دکمه‌ی + لایه‌های نقشه</b>: وارد کردن لایه از فایل، یا محدوده‌ی جدید.</li><li><b>ردیف محدوده</b> تیک (نمایش/پنهان کل محدوده)، مداد (تغییر نام/حذف) و یک <b>فلش رو به پایین</b> دارد که لایه‌های آن محدوده را جمع یا باز می‌کند. لایه‌ها زیر محدوده‌شان فهرست می‌شوند؛ لایه‌ی اول فهرست روی بقیه کشیده می‌شود.</li><li>روی <b>ردیف لایه</b> بزنید تا انتخاب شود. آیکون‌ها: زوم به لایه · جدول ویژگی‌ها · <b>تنظیمات (نماد لایه)</b> · بالا · پایین · حذف. تیک لایه را نشان یا پنهان می‌کند.</li></ul>`],
['وارد کردن لایه',`<ul><li>پشتیبانی‌شده: <b>GeoJSON</b> (WGS 84)، <b>KML</b> (WGS 84)، <b>شیپ‌فایل</b> به‌صورت ZIP حاوی prj. (هر سیستم مختصاتی، خودکار تبدیل می‌شود).</li><li>پشتیبانی‌نشده: DXF، GPKG، TIFF و فرمت‌هایی که سیستم مختصات خود را اعلام نمی‌کنند. ZIP شیپ‌فایل بدون prj. یا GeoJSON با CRS دیگر با پیام خطا رد می‌شود.</li><li>پنل وارد کردن (از سمت راست باز می‌شود): <b>نام</b>؛ <b>محدوده</b>؛ <b>نوع</b> (آب، گاز، برق، مخابرات، فاضلاب، سایر — رنگ و عمق پیش‌فرض را تعیین می‌کند)؛ <b>رنگ</b>؛ <b>ضخامت خط</b>؛ <b>عمق</b> (متر زیر زمین، AR). خط آخر نشان می‌دهد سیستم مختصات چگونه تشخیص داده شد.</li><li>فیلدی به نام label یا name خودکار برای برچسب انتخاب می‌شود.</li></ul>`],
['تبدیل فرمت‌های دیگر (QGIS)',`<ol><li>فایل را در QGIS باز کنید و CRS درست را بگذارید (مثلاً EPSG:32640 برای UTM 40 شمالی).</li><li>روی لایه راست‌کلیک ← Export ← Save Features As…</li><li><b>GeoJSON</b> با CRS برابر EPSG:4326 یا <b>ESRI Shapefile</b> (همراه prj. فشرده کنید) را انتخاب کنید.</li><li>خروجی را در ARG وارد کنید.</li></ol>`],
['نماد لایه (Layer Symbol)',`<ul><li>با آیکون چرخ‌دنده‌ی لایه‌ی انتخاب‌شده باز می‌شود. <b>💾</b> ذخیره می‌کند، <b>✕</b> بدون ذخیره می‌بندد.</li><li><b>نام لایه</b> و <b>عمق (متر)</b> (وقتی «نمایش در عمق واقعی» روشن است در AR استفاده می‌شود).</li><li><b>نوع نمادگذاری ← یکسان</b>: یک نماد برای کل لایه. <b>دسته‌بندی‌شده</b>: برای هر مقدار <b>فیلد</b> انتخابی یک نماد؛ عارضه‌های با مقدار دیگر از نماد لایه استفاده می‌کنند.</li><li><b>فیلد برچسب</b>: ویژگی‌ای که کنار عارضه‌ها نوشته می‌شود (نقشه: زوم ≥ ۱۷؛ AR: همیشه در محدوده‌ی دید). هیچ‌کدام = بدون برچسب.</li><li><b>نماد لایه</b>: لمس آن رنگ، ضخامت خط و نشانگر نقطه (حلقه یا هیچ) را تعیین می‌کند.</li><li>ابزار دسته‌ها: <b>+</b> افزودن دستی مقدار، <b>↻</b> ساخت دوباره‌ی همه‌ی مقدارها از داده، <b>≡</b> مرتب‌سازی؛ مداد رنگ دسته را عوض می‌کند، <b>✕</b> آن را حذف می‌کند.</li></ul>`],
['ابزارهای نقشه',`<ul><li><b>◎</b> روی موقعیت شما می‌رود (بار اول مجوز می‌خواهد). <b>🔍</b>: «عرض، طول» بنویسید تا به مختصات بروید، یا متنی بنویسید تا مقدارهای ویژگی لایه‌های نمایان جست‌وجو شود.</li><li><b>خط‌کش</b>: روی نقشه نقطه بزنید تا فاصله اندازه‌گیری شود؛ <b>مثلث</b>: دست‌کم ۳ نقطه برای مساحت. در نوار نتیجه از بازگرداندن، پاک کردن یا ✕ استفاده کنید؛ با لمس دوباره‌ی ابزار از آن خارج می‌شوید.</li><li>روی خط یا نقطه بزنید تا ویژگی‌هایش در پنجره‌ی کوچک دیده شود. نقطه‌ی آبی = شما.</li></ul>`],
['نمای AR',`<ul><li><b>AR</b> را بزنید. بار اول <b>شروع AR با GPS</b> یا <b>شبیه‌سازی در محل پروژه (بدون GPS)</b> را انتخاب کنید (در مرکز پروژه می‌ایستید و با دکمه‌های جهت‌دار راه می‌روید؛ برای آزمایش داخل ساختمان). وقتی اندروید پرسید مجوز <b>دوربین</b> و <b>مکان</b> (گزینه‌ی دقیق / Precise) را بدهید؛ حسگرهای حرکت مجوز نمی‌خواهند.</li><li><b>نوار اطلاعات</b>: جهت، دقت GPS یا «شبیه‌سازی»، تعداد عناصر، فاصله تا نزدیک‌ترین خط. <b>نقشه‌ی کوچک گرد</b>: دید شما از بالا (مثلث سفید) با لایه‌ها به‌صورت خط رنگی؛ پیکان قرمز وقتی پروژه دور است جهتش را نشان می‌دهد. <b>نوار نارنجی</b>: هشدارها.</li><li>خط‌ها با رنگ لایه یا دسته کشیده می‌شوند؛ حلقه‌ها نقطه‌ها را با فاصله به متر نشان می‌دهند؛ برچسب‌ها طبق «فیلد برچسب» هستند.</li></ul>`],
['دکمه‌ها و تنظیمات AR',`<ul><li><b>▲ ▼ ◀ ▶</b>: موقعیت شما را به اندازه‌ی <i>گام جابه‌جایی</i> نسبت به جهت دوربین به جلو/عقب/چپ/راست می‌برد (جبران خطای GPS یا راه‌رفتن در شبیه‌سازی).</li><li><b>چسباندن به نزدیک‌ترین نقطه</b>: شما را دقیقاً روی نزدیک‌ترین نقطه یا رأس خط می‌گذارد — اول کنار یک منهول معلوم بایستید. <b>بازنشانی موقعیت</b> جابه‌جایی‌های دستی را برمی‌گرداند. <b>راه‌اندازی دوباره‌ی دوربین</b> دوربین را دوباره امتحان می‌کند.</li><li><b>⚙ تنظیمات AR</b>: <i>تغییر عمق</i> (فقط با «نمایش در عمق واقعی»)، <i>ارتفاع چشم</i>، <i>زاویه‌ی دید دوربین</i>، <i>تصحیح شیب</i> (همه‌چیز را بالا/پایین می‌برد؛ پیش‌فرض +۳ درجه)، <i>تنظیم افق</i> (دوربین را به افق واقعی بگیرید و بزنید — تصحیح شیب خودکار تنظیم می‌شود)، <i>گام جابه‌جایی</i> و <i>نمایش در عمق واقعی</i> (خاموش = روی سطح زمین، روشن = زیر زمین در عمق لایه).</li></ul>`],
['تنظیمات، پشتیبان‌گیری و بازیابی',`<ul><li>منو ← <b>تنظیمات</b>: زبان (English / فارسی) و پوسته (سیستم / روشن / تاریک)؛ داخل برنامه ذخیره می‌شود.</li><li>منو ← <b>پشتیبان‌گیری و بازیابی</b>: <b>پشتیبان‌گیری</b> پنجره‌ی اشتراک‌گذاری اندروید را با یک فایل JSON از همه‌ی پروژه‌ها باز می‌کند — آن را در Files/Drive ذخیره کنید یا در پیام‌رسان برای خودتان بفرستید؛ <b>بازیابی از فایل</b> چنین فایلی را با انتخابگر فایل برمی‌دارد (جایگزین داده‌ی فعلی).</li><li>پیش از حذف برنامه یا پاک کردن داده‌هایش پشتیبان بگیرید؛ هر دو همه‌ی پروژه‌ها را پاک می‌کنند.</li></ul>`],
['رسیدن به دقت خوب',`<ul><li>GPS گوشی چند متر دقت دارد و کنار ساختمان یا درخت بدتر است. صبر کنید تا نوار وضعیت ± کوچکی نشان دهد. مکان‌یاب اندروید را روشن کنید، برای ARG مجوز مکان <b>دقیق</b> بدهید و بیرون از ساختمان بمانید.</li><li>قطب‌نما را با حرکت ∞ کالیبره کنید و از فلز و خودرو دور بمانید.</li><li>کنار یک نقطه‌ی معلوم بایستید و <b>چسباندن به نزدیک‌ترین نقطه</b> را بزنید. برای دقت سانتی‌متری گیرنده‌ی GNSS خارجی با RTK لازم است.</li></ul>`],
['رفع اشکال',`<ul><li><b>صفحه‌ی سیاه / «دوربین باز نشد»</b>: تنظیمات اندروید ← برنامه‌ها ← ARG ← مجوزها را باز کنید، <b>دوربین</b> را مجاز کنید، به ARG برگردید و «راه‌اندازی دوباره‌ی دوربین» را بزنید. برنامه‌های دیگری که دوربین را اشغال کرده‌اند ببندید.</li><li><b>در AR چیزی نیست</b>: تعداد عناصر، هشدار فاصله‌ی پروژه، تیک‌دار بودن لایه‌ها را ببینید یا شبیه‌سازی را امتحان کنید.</li><li><b>لایه جای اشتباه است</b>: سیستم مختصات فایل اشتباه بوده — در QGIS اصلاح و دوباره وارد کنید.</li><li><b>خط‌ها خیلی بالا/پایین‌اند</b>: «نمایش در عمق واقعی» را خاموش بگذارید، چسباندن به نزدیک‌ترین نقطه را بزنید، سپس تنظیم افق را بزنید و زاویه‌ی دید را تنظیم کنید (بازتر = خط‌ها کوچک‌تر و نزدیک‌تر به افق؛ بسته‌تر = پراکنده‌تر و پایین‌تر).</li><li><b>نقشه خالی است</b>: اینترنت نیست یا سرور نقشه مسدود است — نقشه‌ی پس‌زمینه‌ی دیگری را امتحان کنید.</li><li><b>GPS قرمز می‌ماند / موقعیت نیست</b>: مکان‌یاب اندروید را روشن کنید، مجوز مکان ARG را روی <b>دقیق (Precise)</b> بگذارید و بیرون از ساختمان بروید.</li><li><b>به‌روزرسانی برنامه</b>: APK جدید را روی نسخه‌ی قبلی نصب کنید؛ پروژه‌ها می‌مانند. اگر اندروید نپذیرفت (کلید امضای متفاوت)، پشتیبان بگیرید، برنامه را حذف کنید، APK جدید را نصب کنید و بازیابی کنید.</li></ul>`],
['حریم خصوصی و کار آفلاین',`<ul><li>همه‌ی داده‌ها داخل برنامه روی گوشی شما می‌ماند. برای نگه‌داشتن نسخه‌ی دیگر از پشتیبان‌گیری استفاده کنید.</li><li>خود برنامه کاملاً آفلاین کار می‌کند. فقط نقشه‌های پس‌زمینه به اینترنت نیاز دارند؛ کاشی‌هایی که قبلاً دیده‌اید روی گوشی می‌مانند و آفلاین هم نمایش داده می‌شوند.</li></ul>`]]};
function pHelp(){const L=HELP[SET.lang]||HELP.en;$('panel').innerHTML=phead(t('help'))+`<div class='pbd hp'>${L.map(([h,x],i)=>`<details ${i==0?'open':''}><summary>${h}</summary>${x}</details>`).join('')}</div>`;$('pcl').onclick=()=>pnl(null)}
function pAbout(){$('panel').innerHTML=phead(t('about'))+`<div class=pbd><div style='text-align:center'><img src=icon-192.png width=76 height=76 style='border-radius:18px'><h3 style='margin:8px 0 2px;font-weight:500'>ARG</h3><div class=nt>${t('ver')} ${VER}</div><div class=nt style='margin-top:4px'>${t('tagline')}</div></div><p>${t('abIntro')}</p><p><b>${t('dev')}:</b> Geologix${SET.lang==='fa'?' (ژئولوژیکس)':''}</p><p>${t('abPriv')}</p><p class=nt>${t('abCred')}</p><p class=nt style='text-align:center'>© 2026 Geologix</p></div>`;$('pcl').onclick=()=>pnl(null)}
function pSettings(){$('panel').innerHTML=phead(t('settings'))+`<div class=pbd><div class=fr><span class=lbl>${t('language')}</span><select id=sl><option value=en>English</option><option value=fa>فارسی</option></select></div><div class=fr><span class=lbl>${t('theme')}</span><select id=sth>${['system','light','dark'].map(k=>`<option value=${k}>${t('th_'+k)}</option>`).join('')}</select></div></div>`;
 $('pcl').onclick=()=>pnl(null);$('sl').value=SET.lang;$('sth').value=SET.theme;$('sth').onchange=e=>{SET.theme=e.target.value;saveSet();applyTheme()};
 $('sl').onchange=e=>{SET.lang=e.target.value;saveSet();applyLang();refresh();pSettings()}}
function pBackup(){$('panel').innerHTML=phead(t('backupRestore'))+`<div class=pbd><p class=nt>${t('bkTxt')}</p><div class=stack><button id=bk1>${t('bkNow')}</button><button id=bk2>${t('bkRes')}</button></div></div>`;$('pcl').onclick=()=>pnl(null);$('bk1').onclick=backup;$('bk2').onclick=()=>$('fb').click()}
function pImport(){const m=S.imp;if(!m){pnl(null);return}const f=m.f,gj=m.gj,crs=m.crs,nm=f.name.replace(/\.[^.]+$/,''),g=(GS.find(x=>x[0].test(nm))||[0,'Other'])[1];
 $('panel').innerHTML=phead(t('importLayer'))+`<div class=pbd><div class=fr><span class=lbl>${t('name')}</span><input type=text id=dn class=ti value='${esc(nm)}'></div><div class=fr><span class=lbl>${t('area')}</span><select id=ia>${DB.areas.map((a,i)=>`<option value=${i} ${i==S.tgt?'selected':''}>${esc(a.n)}</option>`).join('')}</select></div><div class=fr><span class=lbl>${t('type')}</span><select id=dt>${Object.keys(TYPES).map(k=>`<option value=${k} ${k==g?'selected':''}>${t('ty_'+k)}</option>`).join('')}</select></div><div class=fr><span class=lbl>${t('color')}</span><input id=dc type=color value=${TYPES[g][0]}></div><div class=fr><span class=lbl>${t('lineWidth')}</span><input type=number id=dw class=ti min=1 max=20 value=4></div><div class=fr><span class=lbl>${t('depth')}</span><input type=number id=dd class=ti step=.1 min=0 value=${TYPES[g][1]}></div><p class=nt>${t('crs')}: ${esc(crs)}</p><div class=act><button id=dno>${t('cancel')}</button><button class=pr id=dok>${t('doImport')}</button></div></div>`;
 $('pcl').onclick=$('dno').onclick=()=>{S.imp=null;pnl(null)};$('dt').onchange=()=>{const p=TYPES[$('dt').value];$('dc').value=p[0];$('dd').value=p[1]};
 $('dok').onclick=()=>{const out={l:[],la:[],p:[],pa:[],t:[]};try{feats(gj,out)}catch(x){toast(x.message);return}
  if(!out.l.length&&!out.p.length){toast(t('noGeom'));return}
  const b=bbox(out);if(!(Math.abs(b[0])<=180&&Math.abs(b[2])<=180&&Math.abs(b[1])<=90&&Math.abs(b[3])<=90)){toast(t('badCoord'));return}
  const fl=[...new Set([].concat(out.la,out.pa).flatMap(a=>Object.keys(a||{})))].slice(0,40),lf=['label','name','Name','NAME'].find(k=>fl.includes(k))||'',ai=+$('ia').value,a=DB.areas[ai];
  a.L.push({id:'l'+Date.now().toString(36),file:f.name,type:$('dt').value,n:$('dn').value||nm,c:$('dc').value,d:+$('dd').value||0,on:1,w:+$('dw').value||4,ps:fl.includes('label')&&!out.l.length?'none':'ring',lf,cat:'',cc:{},fields:fl,g:out,b});fixC(a);S.imp=null;save();setArea(ai);S.off=[0,0];S.fit=0;drawPlan();refresh();toast(t('imported'));pnl('layers')}}

$('arb').onclick=()=>view(S.plan?'ar':'map');$('brand').onclick=()=>drw(1);$('dscr').onclick=()=>drw(0);document.querySelectorAll('#drawer [data-go]').forEach(x=>x.onclick=()=>{drw(0);({proj:()=>pnl('projects'),ps:()=>pnl('ps'),lay:()=>pnl('layers'),imp:impStart,bak:()=>pnl('backup'),set:()=>pnl('settings'),help:()=>pnl('help'),about:()=>pnl('about'),close:welcome})[x.dataset.go]()});
$('lyb').onclick=()=>{if(S.pnl==='layers')pnl(null);else if(!S.open)welcome();else pnl('layers')};
$('stc').onclick=()=>view('map');
$('mloc').onclick=()=>{if(!MAP)return;if(S.ll){MAP.setView([S.ll[1],S.ll[0]],Math.max(MAP.getZoom(),17));return}if(!navigator.geolocation){toast(t('locUnavail'));return}navigator.geolocation.getCurrentPosition(p=>{onGps(p);MAP.setView([p.coords.latitude,p.coords.longitude],Math.max(MAP.getZoom(),17))},()=>toast(t('locUnavail')),{enableHighAccuracy:true,timeout:15000})};
$('msea').onclick=searchDlg;$('mbd').onclick=()=>measure('d');$('mba').onclick=()=>measure('a');$('mzi').onclick=()=>MAP&&MAP.zoomIn();$('mzo').onclick=()=>MAP&&MAP.zoomOut();
$('mrf').onclick=()=>{BL.forEach(x=>x.redraw&&x.redraw());drawPlan()};$('mfx').onclick=()=>{S.fit=0;drawPlan()};
$('mun').onclick=()=>{MP.pop();measUpd()};$('mcl2').onclick=()=>{MP=[];measUpd()};$('mdn').onclick=measEnd;
$('hz').onclick=()=>{if(!S.ok){toast(t('noSensorYet'));return}const m=mat(S.yf),el=Math.asin(Math.max(-1,Math.min(1,-m[2][2])))*180/Math.PI;S.pt=Math.max(-30,Math.min(30,Math.round((S.pt-el)*2)/2));$('pt').value=S.pt;$('ptv').textContent=S.pt;SET.pt=S.pt;saveSet();S.dirty=1;toast(t('horizonSet',{x:S.pt}))};$('an').onclick=anchor;$('ud').onchange=e=>{S.under=e.target.checked?1:0;SET.under=S.under;saveSet();S.dirty=1};$('pt').oninput=e=>{S.pt=+e.target.value;$('ptv').textContent=e.target.value;SET.pt=S.pt;saveSet();S.dirty=1};
$('fb').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d.projects&&!Array.isArray(d.areas))throw 0;DB=d;wire();save();toast(t('backupOk'));welcome()}catch(x){toast(t('backupBad'))}};
MQ().addEventListener('change',applyTheme);
(async()=>{document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||24));applyTheme();applyLang();await load();setArea(0);refresh();view('map');welcome();await needL();try{initMap();drawPlan()}catch(e){toast(t('mapFail'))}
 setInterval(updStrip,800);
 if(navigator.geolocation&&!S.gw){S.gw=1;navigator.geolocation.watchPosition(onGps,e=>{S.gpsErr=e.code==1?'gpsDenied':'gpsNA';updStrip()},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
 if(!(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)){addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true)}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(v.srcObject&&!v.paused)v.pause()}else if(S.started&&!S.plan&&v.srcObject)v.play().catch(()=>{})});S.dirty=1})();
